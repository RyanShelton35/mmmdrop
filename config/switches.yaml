drop_targets:
  bottom:
    switch: s_three_bank_bottom
  middle:
    switch: s_three_bank_middle
  top:
    switch: s_three_bank_top


drop_target_banks:
  three_bank:
    drop_targets: bottom, middle, top
    reset_coils: c_three_bank
    reset_on_complete: 1s


spinners:
  basic_spinner:
    switch: s_spinner


virtual_platform_start_active_switches:
  - s_trough1
  - s_trough2
  - s_trough3
  - s_trough4
  - s_trough5
  - s_trough6
