#config_version=6

coils:
  c_plunger:
    number: 3208-0
    default_pulse_ms: 20
    pulse_events: autoplunge_ball_now
    label: "Auto Plunger"
  c_trough_eject:
    number: 3208-1
    default_pulse_ms: 15
    label: "Trough Eject"
  c_flipper_left_hold:
    number: 3208-2
    allow_enable: True
    label: "Left Flipper Coil Hold Signal"
  c_flipper_left_main:
    number: 3208-3
    default_pulse_ms: 25
    label: "Left Flipper Coil Flip Signal"
  c_flipper_right_hold:
    number: 3208-4
    allow_enable: True
    label: "Right Lower Flipper Coil Hold Signal"
  c_flipper_right_main:
    number: 3208-5
    default_pulse_ms: 21
    label: "Right Lower Flipper Coil Flip Signal"
  c_right_slingshot:
    number: 3208-6
    default_pulse_ms: 15
    label: "Right Sling"
  c_left_slingshot:
    number: 3208-7
    default_pulse_ms: 15
    label: "Left Sling"
  c_flipper_top_right_main:
    number: 0804-0
    default_pulse_ms: 19
    label: "Right Upper Flipper Coil Flip Signal"
  c_flipper_top_right_hold:
    number: 0804-1
    allow_enable: True
    label: "Right Upper Flipper Coil Hold Signal"
  c_right_lower_pop:
    number: 0804-2
    default_pulse_ms: 20
    label: "Lower Right Pop Bumper"
  c_three_bank:
    number: 0804-3
    default_pulse_ms: 23
    pulse_events: reset_drop_bank
    label: "Drop Target Reset"
  c_left_upper_pop:
    number: 0804b-0
    default_pulse_ms: 20
    label: "Upper Left Pop Bumper"
  c_center_upper_pop:
    number: 0804b-1
    default_pulse_ms: 20
    label: "Upper Right Pop Bumper"
  c_scoop_eject:
    number: 0804b-2
    default_pulse_ms: 25
    label: "Scoop Eject"
  c_uppost:
    number: 0804b-3
    default_pulse_ms: 15
    label: "Up Post"
    default_pulse_power: 0.9
    default_hold_power: 0.8
  c_start_light_driver:
    number: cab-2 #L2
    allow_enable: True
    enable_events: enable_always_on_drivers
    default_pulse_power: 1.0
    default_hold_power: 1.0
    label: "Start Light Driver"
  c_coin_light_driver:
    number: cab-0 #L0
    allow_enable: True
    enable_events: enable_always_on_drivers
    default_pulse_power: 1.0
    default_hold_power: 1.0
    label: "Coin Door Light Driver"


autofire_coils:
  left_slingshot:
    coil: c_left_slingshot
    switch: s_left_slingshot
    enable_events: enable_slings, ball_will_start
    disable_events: disable_slings, ball_will_end
  right_slingshot:
    coil: c_right_slingshot
    switch: s_right_slingshot
    enable_events: enable_slings, ball_will_start
    disable_events: disable_slings, ball_will_end
  right_lower_pop:
    coil: c_right_lower_pop
    switch: s_right_lower_pop
    enable_events: enable_pops, ball_will_start
    disable_events: disable_pops, ball_will_end
  left_upper_pop:
    coil: c_left_upper_pop
    switch: s_left_upper_pop
    enable_events: enable_pops, ball_will_start
    disable_events: disable_pops, ball_will_end
  center_upper_pop:
    coil: c_center_upper_pop
    switch: s_center_upper_pop
    enable_events: enable_pops, ball_will_start
    disable_events: disable_pops, ball_will_end
