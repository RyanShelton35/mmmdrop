settings:
  replay_score:
    label: "Replay Score Reset"
    values:
      50000000: "50,000,000"
      100000000: "100,000,000 (Default)"
      200000000: "200,000,000"
    default: 100000000
    key_type: int
    sort: 300
  warnings_to_tilt:
    label: "Number of Tilts to Tilt"
    values:
      0: "0 (No Warnings)"
      1: "1"
      2: "2"
      3: "3 (Default)"
      5: "5"
      10: "10"
    default: 3
    key_type: int
    sort: 600
  settle_time:
    label: "Time Tilt Bob Takes to Settle (Start Next Ball)"
    values:
      3000: "3 Seconds"
      6000: "6 Seconds (Default)"
      10000: "10 Seconds"
    default: 6000
    key_type: int
    sort: 610
  multiple_hit_window:
    label: "Tilt Sensitivity"
    values:
      300: "Sensitive"
      600: "Normal (Default)"
      900: "Insensitive"
      1200: "Very Insensitive"
    default: 600
    key_type: int
    sort: 620
  balls_per_game:
    label: "Balls Per Game"
    values:
      1: "1"
      3: "3 (Default)"
      5: "5"
      7: "7"
      9: "9"
    default: 3
    key_type: int
    sort: 100
  max_players:
    label: "Max Number of Players"
    values:
      1: "1"
      2: "2"
      3: "3"
      4: "4 (Default)"
    default: 4
    key_type: int
    sort: 150
  extra_balls_enabled:
    label: "Extra Balls"
    default: 2
    key_type: int
    sort: 160
    values:
      0: "Fully Disabled"
      1: "20 Million Points"
      2: "Enabled (Default)"
  tournament_mode_enabled:
    label: "Tournament Mode"
    default: 0
    key_type: int
    sort: 170
    values:
      0: "Disabled"
      1: "Enabled"


event_player:
  machine_reset_phase_2:
    game_just_played:
      action: set_machine
      int: 0


variable_player:
