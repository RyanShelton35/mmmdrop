#config_version=6

# mike is using this for the numbers
# https://fastpinball.com/cookbook/lower-third/
# https://fastpinball.com/mpf/config/net/


hardware:
  platform: fast
  driverboards: fast

fast:
  net:
    controller: neuron
    io_loop:
      cab:
        model: FP-I/O-0024
        order: 1
      "3208":
        model: FP-I/O-3208
        order: 2
      "0804":
        model: FP-I/O-0804
        order: 3
      "0804b":
        model: FP-I/O-0804
        order: 4
    debug: false
    watchdog: 3000

  exp:
    boards:
      lightboard:
        model: FP-EXP-0081
    port: COM6
    baud: 921600
    debug: False

  aud:
    port: auto
    debug: False

    main_amp_enabled: True
    sub_amp_enabled: True
    headphones_amp_enabled: True

    main_steps: 10
    sub_steps: 10
    headphones_steps: 10

    default_main_volume: 80
    default_sub_volume: 80
    default_headphones_volume: 60

    persist_volume_settings: True

    max_hw_volume_main: 100
    max_hw_volume_sub: 100
    max_hw_volume_headphones: 100

    main_levels_list: None
    sub_levels_list: None
    headphones_levels_list: None

    link_sub_to_main: True
    link_headphones_to_main: True

    headphones_level: line
    mute_speakers_with_headphones: True


displays:
  window:
    width: 1920
    height: 1080

slide_player:
  init_done:
    loading:
      action: play

config:
  - lights.yaml
  - switches.yaml
  - coils.yaml


machine_vars:
  game_just_played:
    initial_value: 0
    persist: False
    value_type: int
  master_volume:
    initial_value: settings.master_volume
    value_type: str
    persist: True
  this_game_match_video:
    initial_value: 0
    persist: True
    value_type: int


playfields:
  playfield:
    tags: default
    default_source_device: bd_plunger
    enable_ball_search: True


game:
  balls_per_game: settings.balls_per_game
  max_players: settings.max_players


flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
    enable_events: enable_flippers, ball_will_start
    disable_events: disable_flippers, ball_will_end
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper
    enable_events: enable_flippers, ball_will_start
    disable_events: disable_flippers, ball_will_end
  top_right_flipper:
    main_coil: c_flipper_top_right_main
    hold_coil: c_flipper_top_right_hold
    activation_switch: s_top_right_flipper
    enable_events: enable_flippers, ball_will_start
    disable_events: disable_flippers, ball_will_end

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough_jam
    eject_coil: c_trough_eject
    tags: trough, home, drain
    jam_switch: s_trough_jam
    eject_coil_jam_pulse: 15ms
    eject_targets: bd_plunger
    eject_timeouts: 4s
  bd_plunger:
    ball_switches: s_plunger
    mechanical_eject: True
    eject_coil: c_plunger
    eject_timeouts: 5s
  bd_scoop:
    ball_switches: s_scoop
    eject_coil: c_scoop_eject
    eject_timeouts: 3s


diverters:
  up_post:
    activation_coil: c_uppost
    activate_events: uppost_up
    deactivate_events: uppost_down, inner_loop_hit, left_orbit_hit, right_orbit_hit
    activation_time: 500ms
    enable_events: ball_started
    disable_events: ball_ending
    type: hold

ball_saves:
  default:
    active_time: 10s
    hurry_up_time: 4s
    grace_period: 2s
    enable_events: mode_base_started
    timer_start_events: ball_out, mystery_award_ball_save
    auto_launch: True
    balls_to_save: -1
    early_ball_save_events: left_outlane_hit, right_outlane_hit
  mode_start:
    active_time: 5s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: ball_hold_fingerlickingood_scoop_hold_balls_released, ball_hold_highplainsdrifter_scoop_hold_balls_released, ball_hold_intergalactic_scoop_hold_balls_released, ball_hold_paulrevere_scoop_hold_balls_released, ball_hold_sabotage_scoop_hold_balls_released, ball_hold_threemcsand1dj_scoop_hold_balls_released, ball_hold_toomanyrappers_scoop_hold_balls_released, ball_hold_tripletrouble_scoop_hold_balls_released
    auto_launch: True
    balls_to_save: -1
    early_ball_save_events: left_outlane_hit, right_outlane_hit
  instrument_collect:
    active_time: 10s
    hurry_up_time: 3s
    grace_period: 1s
    enable_events: microphone_collected, boombox_collected, turntable_collected
    auto_launch: True
    balls_to_save: -1
    early_ball_save_events: left_outlane_hit, right_outlane_hit
  girls_frenzy:
    active_time: 38s
    hurry_up_time: 5s
    grace_period: 1s
    enable_events: mode_girls_started
    auto_launch: True
    balls_to_save: -1
    early_ball_save_events: left_outlane_hit, right_outlane_hit
  sureshot_ball_saver:
    active_time: 0
    grace_period: 2s
    enable_events: mode_sureshot_started
    disable_events: mode_sureshot_stopped
    auto_launch: True
    balls_to_save: -1
    early_ball_save_events: left_outlane_hit, right_outlane_hit
  mystery_ball_saver:
    active_time: 10s
    hurry_up_time: 4s
    grace_period: 2s
    enable_events: mystery_award_ball_save
    timer_start_events: mystery_award_ball_saver_start
    auto_launch: True
    balls_to_save: -1


modes:
  - base
  - attract
  - skill_shot
  - multiball
  - carousel
  - intergalactic
  - paulrevere
  - service
  - makesomenoise
