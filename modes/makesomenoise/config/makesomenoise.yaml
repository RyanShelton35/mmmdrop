#config_version=6

mode:
  start_events: carousel_item_selected{item=="makesomenoise"}
  stop_events: mode_makesomenoise_stop, multiball_makesomenoise_ended
  priority: 5001


counters:
  makesomenoise_spins_counter:
    count_events: spinner_hit
    events_when_complete: makesomenoise_spins_counter_complete
    starting_count: 40
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_makesomenoise_ended
    restart_events: mode_makesomenoise_started, makesomenoise_final_shot_hit
    control_events:
      - event: reset_makesomenoise_spins_counter
        action: jump
        value: 40
  makesomenoise_ramps_counter:
    count_events: left_ramp_hit, right_ramp_hit
    events_when_complete: makesomenoise_ramps_counter_complete
    starting_count: 4
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_makesomenoise_ended
    restart_events: mode_makesomenoise_started, makesomenoise_final_shot_hit
    control_events:
      - event: reset_makesomenoise_ramps_counter
        action: jump
        value: 4
  makesomenoise_drops_counter:
    count_events: drop_target_middle_down, drop_target_bottom_down, drop_target_top_down
    events_when_complete: makesomenoise_drops_counter_complete
    starting_count: 4
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_makesomenoise_ended
    restart_events: mode_makesomenoise_started, makesomenoise_final_shot_hit
    control_events:
      - event: reset_makesomenoise_drops_counter
        action: jump
        value: 4
  makesomenoise_pops_counter:
    count_events: pop1_hit, pop2_hit, pop3_hit
    events_when_complete: makesomenoise_pops_counter_complete
    starting_count: 10
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_makesomenoise_ended
    restart_events: mode_makesomenoise_started, makesomenoise_final_shot_hit
    control_events:
      - event: reset_makesomenoise_pops_counter
        action: jump
        value: 10
  makesomenoise_captiveball_addaball:
    count_events: captive_ball_hit
    events_when_complete: makesomenoise_addaball
    starting_count: 0
    count_complete_value: 3
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_makesomenoise_ended
    restart_events: mode_makesomenoise_started, makesomenoise_addaball


accruals:
  completing_makesomenoise_counters:
    events:
      - makesomenoise_pops_counter_complete
      - makesomenoise_ramps_counter_complete
      - makesomenoise_drops_counter_complete
      - makesomenoise_spins_counter_complete
    events_when_complete: makesomenoise_final_shot_lit
    restart_events: mode_makesomenoise_started, makesomenoise_final_shot_hit


sequences:
  makesomenoise_final_shot:
    events:
      - inner_loop_hit
    enable_events: makesomenoise_final_shot_lit
    events_when_complete: makesomenoise_final_shot_hit
    reset_on_complete: False
    start_enabled: False
    restart_events: makesomenoise_final_shot_lit


variable_player:
  makesomenoise_drops_counter_complete:
    score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
    mode_makesomenoise_score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
  makesomenoise_pops_counter_complete:
    score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
    mode_makesomenoise_score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
  makesomenoise_ramps_counter_complete:
    score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
    mode_makesomenoise_score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
  makesomenoise_spins_counter_complete:
    score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
    mode_makesomenoise_score: 2000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.makesomenoise_wave
  makesomenoise_final_shot_hit:
    score: 4000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.upper_loop_multiplier * current_player.makesomenoise_wave
    mode_makesomenoise_score: 4000000 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier * current_player.upper_loop_multiplier * current_player.makesomenoise_wave
    makesomenoise_pops_remaining:
      int: 10
      action: set
    makesomenoise_spins_remaining:
      int: 40
      action: set
    makesomenoise_drops_remaining:
      int: 4
      action: set
    makesomenoise_ramps_remaining:
      int: 4
      action: set
    makesomenoise_wave: 1
  timer_makesomenoise_intro_show_tick:
    makesomenoise_intro_show_variable_times_100:
      int: device.timers.makesomenoise_intro_show.ticks * 100
      action: set
  mode_makesomenoise_started:
    mode_blocking_flag:
      int: 1
      action: set
    wizard_blocking_flag:
      int: 1
      action: set
    mode_makesomenoise_score:
      int: 0
      action: set
    makesomenoise_wave:
      int: 1
      action: set
    modes_played: 1
    modes_completed: 1
    battery_charged_yesorno:
      int: 0
      action:
        set
    makesomenoise_pops_remaining:
      int: 10
      action: set
    makesomenoise_spins_remaining:
      int: 40
      action: set
    makesomenoise_drops_remaining:
      int: 4
      action: set
    makesomenoise_ramps_remaining:
      int: 4
      action: set
    active_mode:
      string: "Make Some Noise"
      action: set
    active_mode_objective:
      string: "Finish Counters on Screen, Super Jackpot at Upper Loop to Increase Multiplier"
      action: set
  logicblock_makesomenoise_spins_counter_hit:
    makesomenoise_spins_remaining:
      int: -1
      action: add
  logicblock_makesomenoise_pops_counter_hit:
    makesomenoise_pops_remaining:
      int: -1
      action: add
  logicblock_makesomenoise_ramps_counter_hit:
    makesomenoise_ramps_remaining:
      int: -1
      action: add
  logicblock_makesomenoise_drops_counter_hit:
    makesomenoise_drops_remaining:
      int: -1
      action: add
  right_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier
      block: True
    mode_makesomenoise_score: 110 * current_player.playfield_x * current_player.makesomenoise_mode_multiplier
