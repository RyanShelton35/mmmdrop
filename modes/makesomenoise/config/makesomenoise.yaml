slide_player:
  mode_makesomenoise_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    current_wizard_mode_highlighted:
      action: remove
    makesomenoise:
      action: play
      priority: 500000
    makesomenoise_instructions:
      action: play
      priority: 500001
      expire: 8s
  flipper_cancel{device.ball_holds.wizard_scoop_hold.balls_held==1}:
    makesomenoise_instructions:
      action: remove
  timer_makesomenoise_intro_show_complete:
    makesomenoise_drops_counter:
      action: play
      priority: 800000
    makesomenoise_pops_counter:
      action: play
      priority: 800000
    makesomenoise_spins_counter:
      action: play
      priority: 800000
    makesomenoise_ramps_counter:
      action: play
      priority: 800000
    makesomenoise_damage_wave_counter:
      action: play
      priority: 800000
  makesomenoise_final_shot_lit:
    makesomenoise_final_shot_lit:
      action: play
      priority: 800000
    makesomenoise_spins_counter:
      action: remove
    makesomenoise_ramps_counter:
      action: remove
    makesomenoise_drops_counter:
      action: remove
    makesomenoise_pops_counter:
      action: remove
  makesomenoise_final_shot_hit:
    makesomenoise_final_shot_lit:
      action: remove
    makesomenoise_superjackpot:
      action: play
      expire: 3s
      priority: 800000
  slide_makesomenoise_superjackpot_removed:
    makesomenoise_drops_counter:
      action: play
      priority: 800000
    makesomenoise_pops_counter:
      action: play
      priority: 800000
    makesomenoise_spins_counter:
      action: play
      priority: 800000
    makesomenoise_ramps_counter:
      action: play
      priority: 800000
  makesomenoise_drops_counter_complete:
    makesomenoise_drops_counter:
      action: remove
  makesomenoise_spins_counter_complete:
    makesomenoise_spins_counter:
      action: remove
  makesomenoise_pops_counter_complete:
    makesomenoise_pops_counter:
      action: remove
  makesomenoise_ramps_counter_complete:
    makesomenoise_ramps_counter:
      action: remove


sound_player:
  mode_makesomenoise_started:
    makesomenoisemusic:
      action: replace
      bus: music
      loops: 5
  makesomenoise_drops_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  makesomenoise_pops_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  makesomenoise_ramps_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  makesomenoise_spins_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  makesomenoise_final_shot_hit:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s



timers:
  makesomenoise_intro_show:
    start_value: 0
    end_value: 10
    control_events:
      - action: start
        event: mode_makesomenoise_started
      - action: jump
        value: 10
        event: flipper_cancel{device.ball_holds.wizard_scoop_hold.balls_held==1}


show_player:
  mode_makesomenoise_started:
    makesomenoise_stadium_intro_lights:
      action: play
      loops: -1
  timer_makesomenoise_intro_show_complete:
    makesomenoise_stadium_intro_lights:
      action: stop
    makesomenoise_backboard_show:
      action: play
      loops: -1
    makesomenoise_ramps_shot:
      action: play
      loops: -1
    makesomenoise_spins_shot:
      action: play
      loops: -1
    makesomenoise_pops_shot:
      action: play
      loops: -1
    makesomenoise_drops_shot:
      action: play
      loops: -1
    ball_save_show:
      action: play
      loops: -1
  makesomenoise_ramps_counter_complete:
    makesomenoise_ramps_shot:
      action: stop
  makesomenoise_spins_counter_complete:
    makesomenoise_spins_shot:
      action: stop
  makesomenoise_pops_counter_complete:
    makesomenoise_pops_shot:
      action: stop
  makesomenoise_drops_counter_complete:
    makesomenoise_drops_shot:
      action: stop
  makesomenoise_final_shot_lit:
    makesomenoise_final_shot:
      action: play
      loops: -1
    makesomenoise_right_orbit_uppost_show:
      action: play
      loops: -1
  makesomenoise_final_shot_hit:
    makesomenoise_final_shot:
      action: stop
    makesomenoise_right_orbit_uppost_show:
      action: stop
    makesomenoise_ramps_shot:
      action: play
      loops: -1
    makesomenoise_spins_shot:
      action: play
      loops: -1
    makesomenoise_pops_shot:
      action: play
      loops: -1
    makesomenoise_drops_shot:
      action: play
      loops: -1
  multiball_makesomenoise_shoot_again_ended:
    ball_save_show:
      action: stop


shot_profiles:
  makesomenoise_shot:
    advance_on_hit: False
    states:
      - name: "off"
      - name: lit
        show: flash_color
        show_tokens:
          color: DodgerBlue
        speed: 2
    loop: False


event_player:
  s_right_orbit_active{device.diverters.up_post.active==False and device.sequences.makesomenoise_final_shot.enabled==True}: uppost_up
  inner_loop_hit: uppost_down

