#config_version=6

mode:
  start_events: mode_base_started
  priority: 1000


multiballs:
  chcheckitout:
    ball_count: 3
    start_events: mode_chcheckitout_started
    shoot_again: 15s
    add_a_ball_events: three_bank_standup_hit
    add_a_ball_shoot_again: 4s
    reset_events: multiball_chcheckitout_ended
    enable_events: mode_chcheckitout_starting
  bodymovin:
    ball_count: 3
    start_events: mode_bodymovin_started
    shoot_again: 15s
    add_a_ball_events: three_bank_standup_hit
    add_a_ball_shoot_again: 4s
    reset_events: multiball_bodymovin_ended
    enable_events: mode_bodymovin_starting
  makesomenoise:
    ball_count: 4
    start_events: timer_makesomenoise_intro_show_complete
    shoot_again: 45s
    reset_events: multiball_makesomenoise_ended
    enable_events: mode_makesomenoise_starting
    add_a_ball_events: makesomenoise_addaball
    add_a_ball_shoot_again: 4s
  bodhisattvavow:
    ball_count: 4
    start_events: timer_bodhisattvavow_intro_show_complete
    shoot_again: 1000s
    reset_events: multiball_bodhisattvavow_ended
    enable_events: mode_bodhivow_starting
    stop_events: timer_bodhisattvavow_time_remaining_complete


sound_player:
  multiball_chcheckitout_started:
    chcheckitout_start_callout:
      action: load
      bus: voice
      priority: 10000
  multiball_bodymovin_started:
    bodymovin_start_callout:
      action: load
      bus: voice
      priority: 10000

