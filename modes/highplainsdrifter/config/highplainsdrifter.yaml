    mode_highplainsdrifter_score: 2220 * current_player.playfield_x
  scoop_hit:
    score: 
      int: 2310 * current_player.playfield_x * current_player.scoop_multiplier
      block: True
    mode_highplainsdrifter_score: 2310 * current_player.playfield_x * current_player.scoop_multiplier
  tshirt_top_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 5010 * current_player.playfield_x
  tshirt_bottom_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 5010 * current_player.playfield_x
  three_bank_standup_hit:
    score: 
      int: 20010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 20010 * current_player.playfield_x
  s_left_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_highplainsdrifter_score: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
  s_right_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_highplainsdrifter_score: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
  s_inner_orbit_active:
    score: 
      int: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_highplainsdrifter_score: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
  left_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
      block: True
    mode_highplainsdrifter_score: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
  right_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
      block: True
    mode_highplainsdrifter_score: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
  left_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_highplainsdrifter_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  right_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_highplainsdrifter_score: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier
  inner_loop_hit:
    score: 
      int: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_highplainsdrifter_score: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier


slide_player:
  mode_highplainsdrifter_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    highplainsdrifter:
      action: play
      priority: 500000
    highplainsdrifter_instructions:
      action: play
      priority: 500001
      expire: 7s
  flipper_cancel:
    highplainsdrifter_instructions:
      action: remove
  timer_highplainsdrifter_intro_show_complete:
    highplainsdrifter_shots_counter:
      action: play
      priority: 800000
    highplainsdrifter_display_timer:
      action: play
      priority: 1000000
  highplainsdrifter_shots_counter_complete:
    highplainsdrifter_shots_counter:
      action: remove


sound_player:
  mode_highplainsdrifter_started:
    highplainsdriftermusic:
      action: play
      bus: music
      volume: 1.2 db
  logicblock_highplainsdrifter_shots_counter_hit:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  highplainsdrifter_shots_counter_complete:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: load
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_highplainsdrifter_time_remaining_tick{current_player.highplainsdrifter_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3
    force_all: False
    force_different: False


ball_holds:
  highplainsdrifter_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_highplainsdrifter_started
    disable_events: timer_highplainsdrifter_intro_show_complete
    release_one_events: timer_highplainsdrifter_intro_show_complete


timers:
  highplainsdrifter_intro_show:
    start_value: 0
    end_value: 7
    control_events:
      - action: start
        event: mode_highplainsdrifter_started
      - action: jump
        value: 7
        event: flipper_cancel{device.ball_holds.highplainsdrifter_scoop_hold.balls_held==1}
  highplainsdrifter_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_highplainsdrifter_intro_show_complete
      - action: pause
        event: highplainsdrifter_shots_counter_complete
      - action: reset
        event: mode_highplainsdrifter_started
      - action: add
        value: 5
        event: add_highplainsdrifter_time_5s
      - action: add
        value: 7
        event: add_highplainsdrifter_time_7s


event_player:
  timer_highplainsdrifter_time_remaining_complete: mode_highplainsdrifter_failed
  highplainsdrifter_shots_counter_complete: mode_highplainsdrifter_success
  pop_standup_hit: add_highplainsdrifter_time_7s
  highplainsdrifter_second_shot_hit: add_highplainsdrifter_time_5s
  s_right_orbit_active{device.diverters.up_post.active==False and device.sequences.highplainsdrifter_inner_loop_2.enabled==True}: uppost_up
  inner_loop_hit: uppost_down


shot_profiles:
  highplainsdrifter_shot:
    advance_on_hit: False
    states:
      - name: "off"
    loop: False


show_player:
  mode_highplainsdrifter_started:
    highplainsdrifter_backboard_show:
      action: play
      loops: -1
    highplainsdrifter_pops_show:
      action: play
      loops: -1
    highplainsdrifter_stadium_intro_lights:
      action: play
      loops: -1
  timer_highplainsdrifter_intro_show_complete:
    highplainsdrifter_stadium_intro_lights:
      action: stop
  highplainsdrifter_left_orbit_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  highplainsdrifter_left_ramp_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  highplainsdrifter_inner_loop_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  highplainsdrifter_right_ramp_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  highplainsdrifter_right_orbit_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  logicblock_highplainsdrifter_shots_counter_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0


blinkenlight_player:
  timer_highplainsdrifter_intro_show_complete:
    bl_leftorbit_arrow_led:
      color: EE82EE #violet
    bl_leftramp_arrow_led:
      color: EE82EE #violet
    bl_innerloop_arrow_led:
      color: EE82EE #violet
    bl_rightramp_arrow_led:
      color: EE82EE #violet
    bl_rightorbit_arrow_led:
      color: EE82EE #violet
  highplainsdrifter_left_orbit_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_leftorbit_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_left_ramp_1_done:
    bl_leftorbit_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_leftramp_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_inner_loop_1_done:
    bl_leftramp_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_innerloop_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_right_ramp_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_rightramp_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_right_orbit_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightorbit_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}:
    bl_leftorbit_arrow_led:
      color: EE82EE #violet
    bl_leftramp_arrow_led:
      color: EE82EE #violet
    bl_innerloop_arrow_led:
      color: EE82EE #violet
    bl_rightramp_arrow_led:
      color: EE82EE #violet
    bl_rightorbit_arrow_led:
      color: EE82EE #violet

