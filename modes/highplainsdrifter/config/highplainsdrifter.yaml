#config_version=6

mode:
  start_events: carousel_item_selected{item=="highplainsdrifter"}
  stop_events: mode_highplainsdrifter_stop, mode_highplainsdrifter_failed, mode_highplainsdrifter_success, ball_will_end
  priority: 1001


counters:
  highplainsdrifter_shots_counter:
    count_events: highplainsdrifter_second_shot_hit
    events_when_complete: highplainsdrifter_shots_counter_complete
    starting_count: 3
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_highplainsdrifter_ended
    enable_events: mode_highplainsdrifter_started
    restart_events: mode_highplainsdrifter_started
    control_events:
      - event: reset_highplainsdrifter_shots_counter
        action: jump
        value: 3


sequences:
  highplainsdrifter_left_orbit:
    events:
      - left_orbit_hit
    events_when_complete: highplainsdrifter_left_orbit_1_done
    disable_events: left_ramp_hit, inner_loop_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_left_orbit_2:
    events:
      - left_orbit_hit
    restart_events: highplainsdrifter_left_orbit_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_left_ramp:
    events:
      - left_ramp_hit
    events_when_complete: highplainsdrifter_left_ramp_1_done
    disable_events: left_orbit_hit, inner_loop_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_left_ramp_2:
    events:
      - left_ramp_hit
    restart_events: highplainsdrifter_left_ramp_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_inner_loop:
    events:
      - inner_loop_hit
    events_when_complete: highplainsdrifter_inner_loop_1_done
    disable_events: left_orbit_hit, left_ramp_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_inner_loop_2:
    events:
      - inner_loop_hit
    restart_events: highplainsdrifter_inner_loop_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_right_ramp:
    events:
      - right_ramp_hit
    events_when_complete: highplainsdrifter_right_ramp_1_done
    disable_events: left_orbit_hit, left_ramp_hit, inner_loop_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_right_ramp_2:
    events:
      - right_ramp_hit
    restart_events: highplainsdrifter_right_ramp_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_right_orbit:
    events:
      - right_orbit_hit
    events_when_complete: highplainsdrifter_right_orbit_1_done
    disable_events: left_orbit_hit, left_ramp_hit, inner_loop_hit, right_ramp_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_right_orbit_2:
    events:
      - right_orbit_hit
    restart_events: highplainsdrifter_right_orbit_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False


variable_player:
  logicblock_highplainsdrifter_shots_counter_hit:
    score: 3000000 * current_player.playfield_x * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 3000000 * current_player.playfield_x * current_player.loop_shot_multiplier
    highplainsdrifter_shots_remaining:
      int: -1
      action: add
    loop_shot_multiplier:
      int: 1
      action: set
  highplainsdrifter_left_orbit_1_done:
    score: 1500000 * current_player.playfield_x * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 1500000 * current_player.playfield_x * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  highplainsdrifter_left_ramp_1_done:
    score: 1500000 * current_player.playfield_x * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 1500000 * current_player.playfield_x * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  highplainsdrifter_inner_loop_1_done:
    score: 1500000 * current_player.playfield_x * current_player.upper_loop_multiplier * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 1500000 * current_player.playfield_x * current_player.upper_loop_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  highplainsdrifter_right_ramp_1_done:
    score: 1500000 * current_player.playfield_x * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 1500000 * current_player.playfield_x * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  highplainsdrifter_right_orbit_1_done:
    score: 1500000 * current_player.playfield_x * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
    mode_highplainsdrifter_score: 1500000 * current_player.playfield_x * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  timer_highplainsdrifter_intro_show_tick:
    highplainsdrifter_intro_show_variable_times_100:
      int: device.timers.highplainsdrifter_intro_show.ticks * 100
      action: set
  mode_highplainsdrifter_started:
    mode_blocking_flag:
      int: 1
      action: set
    highplainsdrifter_shots_remaining:
      int: 3
      action: set
    active_mode:
      string: "High Plains Drifter"
      action: set
    active_mode_objective:
      string: "Hit the Same Shot Twice, Do It Twice to Finish"
      action: set
  timer_highplainsdrifter_time_remaining_tick:
    highplainsdrifter_time_remaining_variable_times_1:
      int: device.timers.highplainsdrifter_time_remaining.ticks * 1
      action: set
  right_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 110 * current_player.playfield_x
  left_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 110 * current_player.playfield_x
  right_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 1110 * current_player.playfield_x
  left_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 1110 * current_player.playfield_x
  s_left_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 10 * current_player.playfield_x
  s_right_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 10 * current_player.playfield_x
  pop1_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 1110 * current_player.playfield_x
  pop2_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 1110 * current_player.playfield_x
  pop3_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 1110 * current_player.playfield_x
  upper_pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 5010 * current_player.playfield_x
  pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 5010 * current_player.playfield_x
  captive_ball_hit:
    score: 
      int: 10010 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 10010 * current_player.playfield_x
  spinner_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_highplainsdrifter_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  bottom_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 2220 * current_player.playfield_x
  middle_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_highplainsdrifter_score: 2220 * current_player.playfield_x
  top_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
