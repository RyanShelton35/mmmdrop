#config_version=6

mode:
  start_events: carousel_item_selected{item=="paulrevere"}
  stop_events: mode_paulrevere_stop, mode_paulrevere_failed, mode_paulrevere_success, ball_will_end
  priority: 1001


sequences:
  paulrevere_shot_1:
    events:
      - left_orbit_hit
    events_when_complete: paulrevere_shot_1_done
    reset_on_complete: False
  paulrevere_shot_2:
    events:
      - left_ramp_hit
    enable_events: paulrevere_shot_1_done
    events_when_complete: paulrevere_shot_2_done
    reset_on_complete: False
  paulrevere_shot_3:
    events:
      - captive_ball_hit
    enable_events: paulrevere_shot_2_done
    events_when_complete: paulrevere_shot_3_done
    reset_on_complete: False
  paulrevere_shot_4:
    events:
      - right_ramp_hit
    enable_events: paulrevere_shot_3_done
    events_when_complete: paulrevere_shot_4_done
    reset_on_complete: False
  paulrevere_shot_5:
    events:
      - right_orbit_hit
    enable_events: paulrevere_shot_4_done
    events_when_complete: paulrevere_shot_5_done
    reset_on_complete: False
  paulrevere_shot_6:
    events:
      - scoop_hit
    enable_events: paulrevere_shot_5_done
    events_when_complete: paulrevere_shot_6_done, mode_paulrevere_stop
    reset_on_complete: False


variable_player:
  paulrevere_shot_1_done:
    score: 1000000 * current_player.playfield_x * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
    mode_paulrevere_score: 1000000 * current_player.playfield_x * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  paulrevere_shot_2_done:
    score: 2000000 * current_player.playfield_x * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
    mode_paulrevere_score: 2000000 * current_player.playfield_x * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  paulrevere_shot_3_done:
    score: 5000000 * current_player.playfield_x * current_player.loop_shot_multiplier
    mode_paulrevere_score: 5000000 * current_player.playfield_x * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  paulrevere_shot_4_done:
    score: 3000000 * current_player.playfield_x * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
    mode_paulrevere_score: 3000000 * current_player.playfield_x * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  paulrevere_shot_5_done:
    score: 5000000 * current_player.playfield_x * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
    mode_paulrevere_score: 5000000 * current_player.playfield_x * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  paulrevere_shot_6_done:
    score: 10000000 * current_player.playfield_x * current_player.scoop_multiplier * current_player.loop_shot_multiplier
    mode_paulrevere_score: 10000000 * current_player.playfield_x * current_player.scoop_multiplier * current_player.loop_shot_multiplier
    loop_shot_multiplier:
      int: 1
      action: set
  timer_paulrevere_intro_show_tick:
    paulrevere_intro_show_variable_times_100:
      int: device.timers.paulrevere_intro_show.ticks * 100
      action: set
  mode_paulrevere_started:
    mode_blocking_flag:
      int: 1
      action: set
    active_mode:
      string: "Paul Revere"
      action: set
    active_mode_objective:
      string: "Shoot Lit Shots Left to Right, Finish at Scoop"
      action: set
  timer_paulrevere_time_remaining_tick:
    paulrevere_time_remaining_variable_times_1:
      int: device.timers.paulrevere_time_remaining.ticks * 1
      action: set
  right_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 110 * current_player.playfield_x
  left_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 110 * current_player.playfield_x
  right_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 1110 * current_player.playfield_x
  left_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 1110 * current_player.playfield_x
  s_left_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 10 * current_player.playfield_x
  s_right_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 10 * current_player.playfield_x
  pop1_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 1110 * current_player.playfield_x
  pop2_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 1110 * current_player.playfield_x
  pop3_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 1110 * current_player.playfield_x
  upper_pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 5010 * current_player.playfield_x
  pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 5010 * current_player.playfield_x
  captive_ball_hit:
    score: 
      int: 10010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 10010 * current_player.playfield_x
  spinner_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_paulrevere_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  bottom_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 2220 * current_player.playfield_x
  middle_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 2220 * current_player.playfield_x
  top_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 2220 * current_player.playfield_x
  scoop_hit:
    score: 
      int: 2310 * current_player.playfield_x * current_player.scoop_multiplier
      block: True
    mode_paulrevere_score: 2310 * current_player.playfield_x * current_player.scoop_multiplier
  tshirt_top_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 5010 * current_player.playfield_x
  tshirt_bottom_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 5010 * current_player.playfield_x
  three_bank_standup_hit:
    score: 
      int: 20010 * current_player.playfield_x
      block: True
    mode_paulrevere_score: 20010 * current_player.playfield_x
  s_left_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_paulrevere_score: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
  s_right_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_paulrevere_score: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
  s_inner_orbit_active:
    score: 
      int: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_paulrevere_score: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
  left_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
      block: True
    mode_paulrevere_score: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
  right_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
      block: True
    mode_paulrevere_score: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
  left_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_paulrevere_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  right_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_paulrevere_score: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier
  inner_loop_hit:
    score: 
      int: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_paulrevere_score: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier


slide_player:
  mode_paulrevere_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    paulrevere:
      action: play
      priority: 500000
    paulrevere_instructions:
      action: play
      priority: 500001
      expire: 11s
  flipper_cancel:
    paulrevere_instructions:
      action: remove
  timer_paulrevere_intro_show_complete:
    paulrevere_left_orbit_lit:
      action: play
      priority: 800000
    paulrevere_display_timer:
      action: play
      priority: 1000000
  paulrevere_shot_1_done:
    paulrevere_left_orbit_lit:
      action: remove
    paulrevere_left_ramp_lit:
      action: play
      priority: 800000
  paulrevere_shot_2_done:
    paulrevere_left_ramp_lit:
      action: remove
    paulrevere_captive_ball_lit:
      action: play
      priority: 800000
  paulrevere_shot_3_done:
    paulrevere_captive_ball_lit:
      action: remove
    paulrevere_right_ramp_lit:
      action: play
      priority: 800000
  paulrevere_shot_4_done:
    paulrevere_right_ramp_lit:
      action: remove
    paulrevere_right_orbit_lit:
      action: play
      priority: 800000
  paulrevere_shot_5_done:
    paulrevere_right_orbit_lit:
      action: remove
    paulrevere_final_shot_lit:
      action: play
      priority: 800000
  paulrevere_shot_6_done:
    paulrevere_final_shot_lit:
      action: remove


sound_player:
  mode_paulrevere_started:
    paulrevere_music:
      action: play
      bus: music
  paulrevere_shot_1_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  paulrevere_shot_2_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  paulrevere_shot_3_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  paulrevere_shot_4_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  paulrevere_shot_5_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  paulrevere_shot_6_done:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: load
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_paulrevere_time_remaining_tick{current_player.paulrevere_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3
    force_all: False
    force_different: False


ball_holds:
  paulrevere_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_paulrevere_started
    disable_events: timer_paulrevere_intro_show_complete
    release_one_events: timer_paulrevere_intro_show_complete


timers:
  paulrevere_intro_show:
    start_value: 0
    end_value: 11
    control_events:
      - action: start
        event: mode_paulrevere_started
      - action: jump
        value: 11
        event: flipper_cancel{device.ball_holds.paulrevere_scoop_hold.balls_held==1}
  paulrevere_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_paulrevere_intro_show_complete
      - action: pause
        event: paulrevere_shot_6_done
      - action: reset
        event: mode_paulrevere_started
      - action: add
        value: 5
        event: add_paulrevere_time_5s
      - action: add
        value: 15
        event: add_paulrevere_time_15s


event_player:
  timer_paulrevere_time_remaining_complete: mode_paulrevere_failed
  paulrevere_shot_6_done: mode_paulrevere_success
  paulrevere_shot_1_done: add_paulrevere_time_5s
  paulrevere_shot_2_done: add_paulrevere_time_5s
  paulrevere_shot_3_done: add_paulrevere_time_5s
  paulrevere_shot_4_done: add_paulrevere_time_5s
  paulrevere_shot_5_done: add_paulrevere_time_5s
  pop_standup_hit: add_paulrevere_time_15s
  s_right_orbit_active{device.diverters.up_post.active==False and device.sequences.paulrevere_shot_3.enabled==True}: uppost_up
  s_left_orbit_active{device.diverters.up_post.active==False and device.sequences.paulrevere_shot_6.enabled==True}: uppost_up
  inner_loop_hit: uppost_down


show_player:
  paulrevere_shot_5_done:
    paulrevere_final_shot:
      action: play
      loops: -1
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  mode_paulrevere_started:
    paulrevere_backboard_show:
      action: play
      loops: -1
    paulrevere_pops_show:
      action: play
      loops: -1
    paulrevere_stadium_intro_lights:
      action: play
      loops: -1
    cassette_spin_rewind_slow:
      action: play
      loops: -1
      priority: 100000
  timer_paulrevere_intro_show_complete:
    paulrevere_stadium_intro_lights:
      action: stop
  paulrevere_shot_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  paulrevere_shot_2_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  paulrevere_shot_3_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  paulrevere_shot_4_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  paulrevere_shot_6_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0


blinkenlight_player:
  timer_paulrevere_intro_show_complete:
    bl_leftorbit_arrow_led:
      color: 7B68EE
  paulrevere_shot_1_done:
    bl_leftorbit_arrow_led: remove
    bl_leftramp_arrow_led:
      color: 7B68EE
  paulrevere_shot_2_done:
    bl_leftramp_arrow_led: remove
    bl_captiveball_smallcircle_led:
      color: 7B68EE
  paulrevere_shot_3_done:
    bl_captiveball_smallcircle_led: remove
    bl_rightramp_arrow_led:
      color: 7B68EE
  paulrevere_shot_4_done:
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led:
      color: 7B68EE
  paulrevere_shot_5_done:
    bl_rightorbit_arrow_led: remove


shot_profiles:
  paulrevere_shot:
    advance_on_hit: False
    states:
      - name: "off"
    loop: False
