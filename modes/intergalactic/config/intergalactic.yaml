slide_player:
  mode_intergalactic_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    intergalactic:
      action: play
      priority: 500000
    intergalactic_instructions:
      action: play
      priority: 500001
      expire: 9s
  flipper_cancel:
    intergalactic_instructions:
      action: remove
  timer_intergalactic_intro_show_complete:
    intergalactic_right_shot_lit:
      action: play
      priority: 800000
    intergalactic_display_timer:
      action: play
      priority: 1000000
  intergalactic_shot_1_done:
    intergalactic_right_shot_lit:
      action: remove
    intergalactic_left_shot_lit:
      action: play
      priority: 800000
  intergalactic_shot_2_done:
    intergalactic_left_shot_lit:
      action: remove
    intergalactic_right_shot_lit:
      action: play
      priority: 800000
  intergalactic_shot_3_done:
    intergalactic_right_shot_lit:
      action: remove
    intergalactic_left_shot_lit:
      action: play
      priority: 800000
  intergalactic_shot_4_done:
    intergalactic_left_shot_lit:
      action: remove
    intergalactic_final_shot_lit:
      action: play
      priority: 800000
  intergalactic_shot_5_done:
    intergalactic_final_shot_lit:
      action: remove
    intergalactic_display_timer:
      action: remove
  timer_intergalactic_time_remaining_complete:
    intergalactic_display_timer:
      action: remove


sound_player:
  normal_intergalactic:
    intergalacticmusic:
      action: play
      bus: music
  rare_intergalactic:
    intergalactic_rare:
      action: play
      bus: music
  intergalactic_shot_1_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  intergalactic_shot_2_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  intergalactic_shot_3_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  intergalactic_shot_4_done:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  intergalactic_shot_5_done:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: load
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_intergalactic_time_remaining_tick{current_player.intergalactic_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3
    force_all: False
    force_different: False
  mode_intergalactic_started:
    events:
      normal_intergalactic: 99
      rare_intergalactic: 1
    force_all: False
    force_different: False


ball_holds:
  intergalactic_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_intergalactic_started
    disable_events: timer_intergalactic_intro_show_complete
    release_one_events: timer_intergalactic_intro_show_complete

timers:
  intergalactic_intro_show:
    start_value: 0
    end_value: 13
    control_events:
      - action: start
        event: mode_intergalactic_started
      - action: jump
        value: 13
        event: flipper_cancel{device.ball_holds.intergalactic_scoop_hold.balls_held==1}
  intergalactic_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_intergalactic_intro_show_complete
      - action: pause
        event: intergalactic_shot_5_done
      - action: reset
        event: mode_intergalactic_started
      - action: add
        value: 5
        event: add_intergalactic_time_5s
      - action: add
        value: 15
        event: add_intergalactic_time_15s

event_player:
  timer_intergalactic_time_remaining_complete: mode_intergalactic_failed
  intergalactic_shot_5_done: mode_intergalactic_success
  pop_standup_hit: add_intergalactic_time_15s
  intergalactic_shot_1_done: add_intergalactic_time_5s
  intergalactic_shot_2_done: add_intergalactic_time_5s
  intergalactic_shot_3_done: add_intergalactic_time_5s
  intergalactic_shot_4_done: add_intergalactic_time_5s


show_player:
  intergalactic_shot_4_done:
    intergalactic_final_shot:
      action: play
      loops: -1
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  mode_intergalactic_started:
    intergalactic_intro_lights:
      action: play
      loops: -1
    intergalactic_stadium_intro_lights:
      action: play
      loops: -1
  timer_intergalactic_intro_show_complete:
    intergalactic_intro_lights:
      action: stop
    intergalactic_stadium_intro_lights:
      action: stop
    intergalactic_backboard_show:
      action: play
      loops: -1
    intergalactic_pops_show:
      action: play
      loops: -1
  intergalactic_shot_1_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  intergalactic_shot_2_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  intergalactic_shot_3_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  intergalactic_shot_5_done:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0


blinkenlight_player:
  timer_intergalactic_intro_show_complete:
    bl_rightorbit_arrow_led:
      color: yellow
    bl_rightramp_arrow_led:
      color: yellow
  intergalactic_shot_1_done:
    bl_rightorbit_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_leftorbit_arrow_led:
      color: yellow
    bl_leftramp_arrow_led:
      color: yellow
  intergalactic_shot_2_done:
    bl_leftorbit_arrow_led: remove
    bl_leftramp_arrow_led: remove
    bl_rightorbit_arrow_led:
      color: yellow
    bl_rightramp_arrow_led:
      color: yellow
  intergalactic_shot_3_done:
    bl_rightorbit_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_leftorbit_arrow_led:
      color: yellow
    bl_leftramp_arrow_led:
      color: yellow
  intergalactic_shot_4_done:
    bl_leftorbit_arrow_led: remove
    bl_leftramp_arrow_led: remove


shot_profiles:
  intergalactic_shot:
    advance_on_hit: False
    states:
      - name: "off"
      - name: lit
        show: flash_color
        show_tokens:
          color: DodgerBlue
        speed: 2
    loop: False

