#config_version=6

mode:
  start_events: carousel_item_selected{item=="sabotage"}
  stop_events: mode_sabotage_stop, mode_sabotage_failed, mode_sabotage_success, ball_will_end
  priority: 1001



shots:
  sabotage_left_orbit:
    hit_events: left_orbit_hit
  sabotage_left_ramp:
    hit_events: left_ramp_hit
  sabotage_right_ramp:
    hit_events: right_ramp_hit
  sabotage_right_orbit:
    hit_events: right_orbit_hit


variable_player:
  mode_sabotage_started:
    mode_blocking_flag:
      int: 1
      action: set
    sabotage_perps_caught:
      int: 0
      action: set
    stache_multiplier:
      int: 1
      action: set
    active_mode:
      string: "Sabotage"
      action: set
    active_mode_objective:
      string: "Shoot Ramps and Orbits, Avoid Standups"
      action: set
  left_orbit_hit:
    score:
      int: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
      block: True
    mode_sabotage_score: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.left_orbit_multiplier * current_player.loop_shot_multiplier
    sabotage_perps_caught:
      int: 1
      action: add
    stache_multiplier:
      int: 1
      action: set
    loop_shot_multiplier:
      int: 1
      action: set
  left_ramp_hit:
    score:
      int: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
      block: True
    mode_sabotage_score: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.left_ramp_multiplier * current_player.loop_shot_multiplier
    sabotage_perps_caught:
      int: 1
      action: add
    stache_multiplier:
      int: 1
      action: set
    loop_shot_multiplier:
      int: 1
      action: set
  right_ramp_hit:
    score:
      int: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
      block: True
    mode_sabotage_score: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.right_ramp_multiplier * current_player.loop_shot_multiplier
    sabotage_perps_caught:
      int: 1
      action: add
    stache_multiplier:
      int: 1
      action: set
    loop_shot_multiplier:
      int: 1
      action: set
  right_orbit_hit:
    score:
      int: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
      block: True
    mode_sabotage_score: 2000000 * current_player.playfield_x * current_player.stache_multiplier * current_player.right_orbit_multiplier * current_player.loop_shot_multiplier
    sabotage_perps_caught:
      int: 1
      action: add
    stache_multiplier:
      int: 1
      action: set
    loop_shot_multiplier:
      int: 1
      action: set
  decrease_perps{current_player.sabotage_perps_caught>0}:
    sabotage_perps_caught:
      int: -1
      action: add
  decrease_perps{current_player.sabotage_perps_caught==0}:
    sabotage_perps_caught:
      int: 0
      action: set
  timer_sabotage_intro_show_tick:
    sabotage_intro_show_variable_times_100:
      int: device.timers.sabotage_intro_show.ticks * 100
      action: set
  timer_sabotage_time_remaining_tick:
    sabotage_time_remaining_variable_times_1:
      int: device.timers.sabotage_time_remaining.ticks * 1
      action: set
  drop_target_bank_three_bank_down:
    stache_multiplier:
      int: 3
      action: set
  slide_mustache1x_created:
    stache_multiplier:
      int: 1
      action: set
  right_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 110 * current_player.playfield_x
  left_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 110 * current_player.playfield_x
  right_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 1110 * current_player.playfield_x
  left_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 1110 * current_player.playfield_x
  s_left_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_sabotage_score: 10 * current_player.playfield_x
  s_right_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_sabotage_score: 10 * current_player.playfield_x
  pop1_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 1110 * current_player.playfield_x
  pop2_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 1110 * current_player.playfield_x
  pop3_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_sabotage_score: 1110 * current_player.playfield_x
  upper_pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 5010 * current_player.playfield_x
  pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 5010 * current_player.playfield_x
  captive_ball_hit:
    score: 
      int: 10010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 10010 * current_player.playfield_x
  spinner_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_sabotage_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  bottom_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_sabotage_score: 2220 * current_player.playfield_x
  middle_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_sabotage_score: 2220 * current_player.playfield_x
  top_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_sabotage_score: 2220 * current_player.playfield_x
  scoop_hit:
    score: 
      int: 2310 * current_player.playfield_x * current_player.scoop_multiplier
      block: True
    mode_sabotage_score: 2310 * current_player.playfield_x * current_player.scoop_multiplier
  tshirt_top_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 5010 * current_player.playfield_x
  tshirt_bottom_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 5010 * current_player.playfield_x
  three_bank_standup_hit:
    score: 
      int: 20010 * current_player.playfield_x
      block: True
    mode_sabotage_score: 20010 * current_player.playfield_x
  s_left_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_sabotage_score: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
  s_right_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_sabotage_score: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
  s_inner_orbit_active:
    score: 
      int: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_sabotage_score: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
  inner_loop_hit:
    score: 
      int: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_sabotage_score: 2010 * current_player.playfield_x * current_player.upper_loop_multiplier


slide_player:
  mode_sabotage_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    sabotage:
      action: play
      priority: 500000
    sabotage_instructions:
      action: play
      priority: 500001
      expire: 11s
  timer_sabotage_intro_show_complete:
    sabotage_instructions:
      action: remove
    sabotage_perps_counter:
      action: play
      priority: 800000
    sabotage_display_timer:
      action: play
      priority: 1000000
    mustache1x:
      action: play
      priority: 1000001
  player_stache_multiplier{current_player.stache_multiplier==1 and device.timers.sabotage_time_remaining.running==True}:
    mustache3x:
      action: remove
    mustache1x:
      action: play
      priority: 1000001
  player_stache_multiplier{current_player.stache_multiplier==3}:
    mustache1x:
      action: remove
    mustache3x:
      action: play
      priority: 1000001


sound_player:
  mode_sabotage_started:
    sabotagemusic:
      action: play
      bus: music
  increase_perps:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  sabotage_perps_counter_complete:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: load
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_sabotage_time_remaining_tick{current_player.sabotage_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3
    force_all: False
    force_different: False


ball_holds:
  sabotage_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_sabotage_started
    disable_events: timer_sabotage_intro_show_complete
    release_one_events: timer_sabotage_intro_show_complete


timers:
  sabotage_intro_show:
    start_value: 0
    end_value: 11
    control_events:
      - action: start
        event: mode_sabotage_started
      - action: jump
        value: 11
        event: flipper_cancel{device.ball_holds.sabotage_scoop_hold.balls_held==1}
  sabotage_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_sabotage_intro_show_complete
      - action: pause
        event: sabotage_perps_counter_complete
      - action: reset
        event: mode_sabotage_started
      - action: add
        value: 7
        event: add_sabotage_time_7s
      - action: add
        value: 15
        event: add_sabotage_time_15s


event_player:
  timer_sabotage_time_remaining_complete: mode_sabotage_failed
  sabotage_perps_counter_complete: mode_sabotage_success
  left_orbit_hit: increase_perps
  left_ramp_hit: increase_perps
  right_ramp_hit: increase_perps
  right_orbit_hit: increase_perps
  increase_perps: add_sabotage_time_7s
  pop_standup_hit: add_sabotage_time_15s, decrease_perps
  player_sabotage_perps_caught{current_player.sabotage_perps_caught==4}: sabotage_perps_counter_complete


shot_profiles:
  sabotage_shot:
    advance_on_hit: False
    states:
      - name: "off"
    loop: False


show_player:
  mode_sabotage_started:
    sirens_show:
      action: play
      loops: -1
    sabotage_stadium_intro_lights:
      action: play
      loops: -1
  timer_sabotage_intro_show_complete:
    stache_show:
      action: play
      loops: -1
      priority: 50000
    sabotage_stadium_intro_lights:
      action: stop
  player_stache_multiplier{current_player.stache_multiplier==1 and device.timers.sabotage_time_remaining.running==True}:
    stache_show:
      action: play
      loops: -1
      priority: 50000
  player_stache_multiplier{current_player.stache_multiplier==3}:
    stache_show:
      action: stop
  sabotage_perps_counter_complete:
    sirens_show:
      action: stop
    stache_show:
      action: stop
    mode_shot_hit_lights:
      action: play
      priority: 500000
  sabotage_perps_counter_failed:
    sirens_show:
      action: stop
    stache_show:
      action: stop
  left_ramp_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  left_orbit_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  right_ramp_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0
  right_orbit_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0

