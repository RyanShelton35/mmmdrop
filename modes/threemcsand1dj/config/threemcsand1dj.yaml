#config_version=6

mode:
  start_events: carousel_item_selected{item=="threemcsand1dj"}
  stop_events: mode_threemcsand1dj_stop, mode_threemcsand1dj_failed, mode_threemcsand1dj_success, ball_will_end
  priority: 1001


counters:
  threemcsand1dj_scratches_counter:
    count_events: inner_loop_hit
    events_when_complete: threemcsand1dj_scratches_counter_complete
    starting_count: 3
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_threemcsand1dj_ended
    enable_events: mode_threemcsand1dj_started
    restart_events: mode_threemcsand1dj_started



variable_player:
  mode_threemcsand1dj_started:
    mode_blocking_flag:
      int: 1
      action: set
    threemcsand1dj_scratch_value:
      int: 100000
      action: set
    threemcsand1dj_mix_multiplier:
      int: 1
      action: set
    threemcsand1dj_scratches_remaining:
      int: 3
      action: set
    active_mode:
      string: "3 MCs and 1 DJ"
      action: set
    active_mode_objective:
      string: "Hit 3 Upper Loops, Boost Value with Captive Ball and Pops"
      action: set
  inner_loop_hit:
    score:
      int: current_player.threemcsand1dj_scratch_value * current_player.threemcsand1dj_mix_multiplier * current_player.playfield_x * current_player.upper_loop_multiplier * current_player.loop_shot_multiplier
      block: True
    mode_threemcsand1dj_score: current_player.threemcsand1dj_scratch_value * current_player.threemcsand1dj_mix_multiplier * current_player.playfield_x * current_player.upper_loop_multiplier * current_player.loop_shot_multiplier
  timer_threemcsand1dj_intro_show_tick:
    threemcsand1dj_intro_show_variable_times_100:
      int: device.timers.threemcsand1dj_intro_show.ticks * 100
      action: set
  timer_threemcsand1dj_time_remaining_tick:
    threemcsand1dj_time_remaining_variable_times_1:
      int: device.timers.threemcsand1dj_time_remaining.ticks * 1
      action: set
  logicblock_threemcsand1dj_scratches_counter_hit:
    threemcsand1dj_scratches_remaining:
      int: -1
      action: add
  right_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 110 * current_player.playfield_x
  left_inlane_hit:
    score: 
      int: 110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 110 * current_player.playfield_x
  right_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 1110 * current_player.playfield_x
  left_outlane_hit:
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 1110 * current_player.playfield_x
  s_left_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 10 * current_player.playfield_x
  s_right_slingshot_active:
    score: 
      int: 10 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 10 * current_player.playfield_x
  pop1_hit:
    threemcsand1dj_scratch_value:
      int: 25000
      action: add
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 1110 * current_player.playfield_x
  pop2_hit:
    threemcsand1dj_scratch_value:
      int: 25000
      action: add
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 1110 * current_player.playfield_x
  pop3_hit:
    threemcsand1dj_scratch_value:
      int: 25000
      action: add
    score: 
      int: 1110 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 1110 * current_player.playfield_x
  upper_pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 5010 * current_player.playfield_x
  pop_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 5010 * current_player.playfield_x
  captive_ball_hit:
    threemcsand1dj_mix_multiplier:
      int: 1
      action: add
    score: 
      int: 10010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 10010 * current_player.playfield_x
  spinner_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_threemcsand1dj_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  bottom_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 2220 * current_player.playfield_x
  middle_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 2220 * current_player.playfield_x
  top_drop_hit:
    score: 
      int: 2220 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 2220 * current_player.playfield_x
  scoop_hit:
    score: 
      int: 2310 * current_player.playfield_x * current_player.scoop_multiplier
      block: True
    mode_threemcsand1dj_score: 2310 * current_player.playfield_x * current_player.scoop_multiplier
  tshirt_top_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 5010 * current_player.playfield_x
  tshirt_bottom_standup_hit:
    score: 
      int: 5010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 5010 * current_player.playfield_x
  three_bank_standup_hit:
    score: 
      int: 20010 * current_player.playfield_x
      block: True
    mode_threemcsand1dj_score: 20010 * current_player.playfield_x
  s_left_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_threemcsand1dj_score: 110 * current_player.playfield_x * current_player.left_orbit_multiplier
  s_right_orbit_active:
    score: 
      int: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_threemcsand1dj_score: 110 * current_player.playfield_x * current_player.right_orbit_multiplier
  s_inner_orbit_active:
    score: 
      int: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
      block: True
    mode_threemcsand1dj_score: 1010 * current_player.playfield_x * current_player.upper_loop_multiplier
  left_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
      block: True
    mode_threemcsand1dj_score: 3010 * current_player.playfield_x * current_player.left_ramp_multiplier
  right_ramp_hit:
    score: 
      int: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
      block: True
    mode_threemcsand1dj_score: 3010 * current_player.playfield_x * current_player.right_ramp_multiplier
  left_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
      block: True
    mode_threemcsand1dj_score: 1010 * current_player.playfield_x * current_player.left_orbit_multiplier
  right_orbit_hit:
    score: 
      int: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier
      block: True
    mode_threemcsand1dj_score: 1010 * current_player.playfield_x * current_player.right_orbit_multiplier


slide_player:
  mode_threemcsand1dj_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    threemcsand1dj:
      action: play
      priority: 500000
    threemcsand1dj_instructions:
      action: play
      priority: 500001
      expire: 9s
  timer_threemcsand1dj_intro_show_complete:
    threemcsand1dj_instructions:
      action: remove
    threemcsand1dj_scratches_counter:
      action: play
      priority: 800000
    threemcsand1dj_display_timer:
      action: play
      priority: 1000000
    threemcsand1dj_scratch_value:
      action: play
      priority: 830000
    threemcsand1dj_mix_multiplier:
      action: play
      priority: 835000


sound_player:
  mode_threemcsand1dj_started:
    threemcsand1djmusic:
      action: play
      bus: music
  inner_loop_hit:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  threemcsand1dj_scratches_counter_complete:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: load
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: load
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_threemcsand1dj_time_remaining_tick{current_player.threemcsand1dj_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3
    force_all: False
    force_different: False


ball_holds:
  threemcsand1dj_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_threemcsand1dj_started
    disable_events: timer_threemcsand1dj_intro_show_complete
    release_one_events: timer_threemcsand1dj_intro_show_complete


timers:
  threemcsand1dj_intro_show:
    start_value: 0
    end_value: 9
    control_events:
      - action: start
        event: mode_threemcsand1dj_started
      - action: jump
        value: 9
        event: flipper_cancel{device.ball_holds.threemcsand1dj_scoop_hold.balls_held==1}
  threemcsand1dj_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_threemcsand1dj_intro_show_complete
      - action: pause
        event: threemcsand1dj_scratches_counter_complete
      - action: reset
        event: mode_threemcsand1dj_started
      - action: add
        value: 5
        event: add_threemcsand1dj_time_5s
      - action: add
        value: 15
        event: add_threemcsand1dj_time_15s


event_player:
  timer_threemcsand1dj_time_remaining_complete: mode_threemcsand1dj_failed
  threemcsand1dj_scratches_counter_complete: mode_threemcsand1dj_success
  logicblock_threemcsand1dj_scratches_counter_hit: add_threemcsand1dj_time_5s
  pop_standup_hit: add_threemcsand1dj_time_15s, decrease_perps
  s_right_orbit_active{device.diverters.up_post.active==False}: uppost_up
  inner_loop_hit: uppost_down
  s_inner_orbit_active: uppost_down


shot_profiles:
  threemcsand1dj_shot:
    advance_on_hit: False
    states:
      - name: "off"
    loop: False


show_player:
  mode_threemcsand1dj_started:
    threemcsand1dj_stadium_intro_lights:
      action: play
      loops: -1
  timer_threemcsand1dj_intro_show_complete:
    threemcsand1dj_stadium_intro_lights:
      action: stop
    threemcsand1dj_backboard_show:
      action: play
      loops: -1
    threemcs_upper_loop_show:
      action: play
      loops: -1
    threemcs_right_orbit_uppost_show:
      action: play
      loops: -1
  inner_loop_hit:
    mode_shot_hit_lights:
      action: play
      priority: 500000
      loops: 0



blinkenlight_player:
  timer_threemcsand1dj_intro_show_complete:
    bl_lowerrightpop_inside_led:
      color: red
    bl_lowerrightpop_inside2_led:
      color: red
    bl_upperleftpop_inside_led:
      color: red
    bl_uppercenterpop_inside_led:
      color: red
    bl_captiveball_smallcircle_led:
      color: red
  threemcsand1dj_scratches_counter_complete:
    bl_lowerrightpop_inside_led: stop
    bl_lowerrightpop_inside2_led: stop
    bl_upperleftpop_inside_led: stop
    bl_uppercenterpop_inside_led: stop
    bl_captiveball_smallcircle_led: stop
