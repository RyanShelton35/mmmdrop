slide_player:
  mode_bodhivow_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    current_wizard_mode_highlighted:
      action: remove
    bodhisattvavow:
      action: play
      priority: 500000
    bodhisattvavow_instructions:
      action: play
      priority: 500001
      expire: 8s
  timer_bodhisattvavow_intro_show_complete:
    bodhisattvavow_instructions:
      action: remove
    bodhisattvavow_display_timer:
      action: play
      priority: 1000000


sound_player:
  mode_bodhivow_started:
    bodhisattvavowmusic:
      action: replace
      bus: music
      loops: 5
  bodhisattvavow_area1_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  bodhisattvavow_area2_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  bodhisattvavow_area3_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  bodhisattvavow_area4_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  bodhisattvavow_area5_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms


timers:
  bodhisattvavow_intro_show:
    start_value: 0
    end_value: 8
    control_events:
      - action: start
        event: mode_bodhivow_started
      - action: jump
        value: 8
        event: flipper_cancel{device.ball_holds.wizard_scoop_hold.balls_held==1}
  bodhisattvavow_time_remaining:
    start_value: 50
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_bodhisattvavow_intro_show_complete
      - action: pause
        event: multiball_bodhisattvavow_ended
      - action: add
        value: 1
        event: add_bodhisattvavow_time_1s


