#config_version=6

mode:
  start_events: carousel_item_selected{item=="bodhisattvavow"}
  stop_events: mode_bodhivow_stop, timer_bodhisattvavow_time_remaining_complete
  priority: 5001


counters:
  bodhisattvavow_area1_counter:
    count_events: inner_loop_hit, captive_ball_hit, scoop_hit, upper_pop_standup_hit, tshirt_top_standup_hit, tshirt_bottom_standup_hit
    events_when_complete: bodhisattvavow_area1_counter_complete
    starting_count: 1
    count_complete_value: 5
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_bodhivow_ended
    restart_events: mode_bodhivow_started, bodhisattvavow_area1_counter_complete
  bodhisattvavow_area2_counter:
    count_events: left_orbit_hit, left_ramp_hit
    events_when_complete: bodhisattvavow_area2_counter_complete
    starting_count: 1
    count_complete_value: 5
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_bodhivow_ended
    restart_events: mode_bodhivow_started, bodhisattvavow_area2_counter_complete
  bodhisattvavow_area3_counter:
    count_events: right_ramp_hit, right_orbit_hit
    events_when_complete: bodhisattvavow_area3_counter_complete
    starting_count: 1
    count_complete_value: 5
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_bodhivow_ended
    restart_events: mode_bodhivow_started, bodhisattvavow_area3_counter_complete
  bodhisattvavow_area4_counter:
    count_events: left_outlane_hit, three_bank_standup_hit, drop_target_bank_three_bank_down
    events_when_complete: bodhisattvavow_area4_counter_complete
    starting_count: 1
    count_complete_value: 5
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_bodhivow_ended
    restart_events: mode_bodhivow_started, bodhisattvavow_area4_counter_complete
  bodhisattvavow_area5_counter:
    count_events: pop3_hit, pop_standup_hit, right_outlane_hit
    events_when_complete: bodhisattvavow_area5_counter_complete
    starting_count: 1
    count_complete_value: 5
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: False
    reset_on_complete: True
    disable_events: mode_bodhivow_ended
    restart_events: mode_bodhivow_started, bodhisattvavow_area5_counter_complete


variable_player:
  timer_bodhisattvavow_intro_show_tick:
    bodhisattvavow_intro_show_variable_times_100:
      int: device.timers.bodhisattvavow_intro_show.ticks * 100
      action: set
  timer_bodhisattvavow_time_remaining_tick:
    bodhisattvavow_time_remaining_variable_times_1:
      int: device.timers.bodhisattvavow_time_remaining.ticks * 1
      action: set
  mode_bodhivow_started:
    mode_blocking_flag:
      int: 1
      action: set
    wizard_blocking_flag:
      int: 1
      action: set
    mode_bodhisattvavow_score:
      int: 0
      action: set
    modes_played: 1
    modes_completed: 1
    battery_charged_yesorno:
      int: 0
      action: set
    active_mode:
      string: "Bodhisattva Vow"
      action: set
    active_mode_objective:
      string: "Cycle Colors to Add Time"
      action: set
  counter_bodhisattvavow_area1_counter_hit:
    score: 100000 * current_player.playfield_x * current_player.bodhisattvavow_mode_multiplier * current_player.bodhisattvavow_area1_counter
    mode_bodhisattvavow_score: 100000 * current_player.playfield_x * current_player.bodhisattvavow_mode_multiplier * current_player.bodhisattvavow_area1_counter
    bodhisattvavow_area1_counter:
      int: device.counters.bodhisattvavow_area1_counter.value * 1
      action: set
  bodhisattvavow_area1_counter_complete:
    bodhisattvavow_area1_counter:
      int: 1
      action: set
  counter_bodhisattvavow_area2_counter_hit:
