timers:
  sureshot_intro_show:
    start_value: 0
    end_value: 7
    control_events:
      - action: start
        event: mode_sureshot_started
      - action: jump
        value: 7
        event: flipper_cancel{device.ball_holds.wizard_scoop_hold.balls_held==1}
  sureshot_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_sureshot_intro_show_complete
      - action: pause
        event: ball_will_end
      - action: add
        value: 10
        event: add_sureshot_time_10s
      - action: add
        value: 3
        event: add_sureshot_time_3s
  sureshot_score_countdown_buffer:
    start_value: 0
    end_value: 2
    direction: up
    start_running: False
    tick_interval: 1s
    control_events:
      - action: start
        event: timer_sureshot_intro_show_complete
      - action: pause
        event: ball_will_end
      - action: pause
        event: mode_sureshot_will_end
      - action: pause
        event: sureshot_shot_hit
      - action: restart
        event: sureshot_phase1_complete
      - action: restart
        event: sureshot_phase2_complete
      - action: restart
        event: sureshot_phase3_complete
      - action: restart
        event: sureshot_phase4_complete
      - action: restart
        event: sureshot_phase5_complete
      - action: restart
        event: sureshot_phase6_complete
      - action: restart
        event: sureshot_phase7_complete
      - action: restart
        event: sureshot_phase8_complete
  sureshot_score_countdown:
    start_value: 100
    end_value: 10
    direction: down
    start_running: False
    tick_interval: 200ms
    control_events:
      - action: pause
        event: ball_will_end
      - action: pause
        event: mode_sureshot_will_end
      - action: pause
        event: sureshot_shot_hit
      - action: reset
        event: sureshot_phase1_complete
      - action: reset
        event: sureshot_phase2_complete
      - action: reset
        event: sureshot_phase3_complete
      - action: reset
        event: sureshot_phase4_complete
      - action: reset
        event: sureshot_phase5_complete
      - action: reset
        event: sureshot_phase6_complete
      - action: reset
        event: sureshot_phase7_complete
      - action: reset
        event: sureshot_phase8_complete
      - action: jump
        value: 100
        event: sureshot_phase1_complete
      - action: jump
        value: 100
        event: sureshot_phase2_complete
      - action: jump
        value: 100
        event: sureshot_phase3_complete
      - action: jump
        value: 100
        event: sureshot_phase4_complete
      - action: jump
        value: 100
        event: sureshot_phase5_complete
      - action: jump
        value: 100
        event: sureshot_phase6_complete
      - action: jump
        value: 100
        event: sureshot_phase7_complete
      - action: jump
        value: 100
        event: sureshot_phase8_complete
      - action: restart
        event: timer_sureshot_score_countdown_buffer_complete


