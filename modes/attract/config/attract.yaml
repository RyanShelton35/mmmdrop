  - attract_sequences.yaml
  - attract_show_player.yaml
  - attract_slide_player.yaml
  - attract_sound_player.yaml
  - attract_timers.yaml

mode_settings:
  selectable_items:
    - gameover{machine.game_just_played==1}
    - last_scores_4p{machine.game_just_played==1}
    - mpf_logo
    - fast_logo
    - riot_logo
    - specialthanks
    - credits
    - pressstart
    - version
    - beastie_pinball_logo
    - show_logo
    - makercredits
    - dedicated
    - highscoregrandchampion
    - highscore1
    - highscore2
    - highscore3
    - highscore4
    - highscoremultiballs
    - highscoremodes1
    - highscoremodes2
    - highscoremodes3
    - highscoremodes4
    - highscoremodes5
    - highscoremodes6
    - highscoremodes7
  next_item_events: s_right_flipper_active, timer_attract_carousel_timer_complete
  previous_item_events: s_left_flipper_active
  disable_events: mode_gamemodeselectcarousel_started
  enable_events: restart_attract
  select_item_events: thiseventwillneverbepostedbutisnecessary

